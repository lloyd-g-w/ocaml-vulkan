name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  build-and-test:
    name: build + test (lavapipe, headless)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Vulkan loader + headers, Mesa's lavapipe (llvmpipe) software ICD,
      # vulkaninfo (diagnostics only), and libffi/pkg-config for
      # ctypes-foreign. No C stubs / Vulkan headers are needed to *build*
      # this project (DESIGN.md §1); libvulkan is only dlopen()ed at runtime.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev mesa-vulkan-drivers vulkan-tools libffi-dev pkg-config

      - name: Set up OCaml 5.2
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"

      # vulkan.opam is dune-generated from dune-project but committed on
      # purpose, so `opam install .` can resolve the package before dune exists.
      - name: Install opam dependencies
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build -j 2

      - name: Locate the lavapipe ICD manifest
        id: lvp
        run: |
          icd=$(find /usr/share/vulkan/icd.d -iname 'lvp_icd*.json' -print -quit)
          if [ -z "$icd" ]; then
            echo "::error::lvp_icd*.json not found under /usr/share/vulkan/icd.d (mesa-vulkan-drivers layout changed?)"
            find /usr/share/vulkan -maxdepth 2 || true
            exit 1
          fi
          echo "Found lavapipe ICD manifest: $icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"

      - name: Vulkan diagnostics (informational, lavapipe should report here)
        continue-on-error: true
        run: vulkaninfo --summary

      - name: Test (dune runtest, VK_ICD_FILENAMES=lavapipe)
        run: opam exec -- dune build -j 2 @runtest

  regen-clean:
    name: scripts/regen.sh leaves the tree clean
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pure `python3 gen/gen.py` (stdlib only, DESIGN.md §1/§13): no OCaml
      # toolchain needed to regenerate lib/generated from registry/vk.xml.
      - name: Regenerate lib/generated from registry/vk.xml
        run: ./scripts/regen.sh

      - name: Fail if regeneration changed anything not already committed
        run: git diff --exit-code

  win64-layout:
    name: struct layouts under a Win64 compiler (mingw-w64 cross check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mingw-w64 cross compiler and libffi/pkg-config
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 libffi-dev pkg-config

      # The headers must match registry/vk.xml (Ubuntu's libvulkan-dev is older).
      - name: Fetch Vulkan-Headers matching registry/VERSION
        run: |
          tag=$(sed -n 's/^Vulkan-Headers tag: //p' registry/VERSION)
          git clone --depth 1 --branch "$tag" https://github.com/KhronosGroup/Vulkan-Headers.git /tmp/vulkan-headers
          echo "VULKAN_HEADERS=/tmp/vulkan-headers" >> "$GITHUB_ENV"

      - name: Set up OCaml 5.2
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"

      - name: Install opam dependencies
        run: opam install . --deps-only

      - name: Check every struct size/offset with x86_64-w64-mingw32-gcc
        run: opam exec -- scripts/check_layout_win64.sh
